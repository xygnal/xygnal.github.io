title: XYgnal about 2D signal
description: Video/image compression and processing notes.
url: https://xygnal.github.io
baseurl: ""
lang: ko
author:
  name: xygnal
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: false
      comments: false

feed:
  posts_limit: 20

exclude:
  - README.md
  - Gemfile.lock
  - vendor/
